# SwiftLint configuration for Bonk
# https://realm.github.io/SwiftLint/rule-directory.html

# Excluded paths
excluded:
  - DerivedData
  - .build
  - Packages
  - Bonk/Models/Resources/SFSymbolNames.swift  # Auto-generated, 8000+ lines
  - .claude

# Rule configuration
line_length:
  warning: 120
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 400
  error: 1000

type_body_length:
  warning: 350
  error: 700

function_body_length:
  warning: 60
  error: 150

cyclomatic_complexity:
  warning: 15
  error: 35

large_tuple:
  warning: 3
  error: 4

function_parameter_count:
  warning: 6
  error: 8

identifier_name:
  min_length: 3
  max_length: 40
  excluded:
    - id
    - ok
    - os
    - ai
    - ui

type_name:
  min_length: 3
  excluded:
    - iCloudSyncService

# Disabled rules
disabled_rules:
  - trailing_comma  # Allow trailing commas in multiline collections
  - opening_brace   # Conflicts with SwiftFormat wrapMultilineStatementBraces
  - inclusive_language  # PTY master/slave is POSIX term, not social; also Disable inclusive check for technical terms
  - statement_position  # Compact if-else single-line style is intentional
